<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>My Coolify Site</title>
  <style>
    body { font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #0f172a; color: #e2e8f0; }
    .card { text-align: center; padding: 2rem 3rem; background: #1e293b; border-radius: 1rem; box-shadow: 0 10px 40px rgba(0,0,0,.4); }
    h1 { color: #38bdf8; }
    .badge { display: inline-block; margin-top: 1rem; padding: .3rem .9rem; background: #166534; border-radius: 9999px; font-size: .9rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello from Coolify!</h1>
    <p>Version 2 — deployed from GitHub via webhook</p>
    <span class="badge">v2</span>
  </div>
</body>
</html>
